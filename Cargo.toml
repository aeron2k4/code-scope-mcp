[package]
name = "code-scope-mcp"
version = "0.1.0"
edition = "2024"
# tree-sitter 0.27 needs Rust 1.90.
rust-version = "1.90"
description = "MCP server for AST-aware code navigation with tree-sitter: outlines, symbol search, references and token-budgeted reads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aeron2k4/code-scope-mcp"
readme = "README.md"
keywords = ["mcp", "tree-sitter", "code-navigation", "llm", "ast"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
heed = { version = "0.22", default-features = false }
ignore = "0.4.34"
regex = "1.13.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
streaming-iterator = "0.1.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"

[[bench]]
name = "report"
harness = false
