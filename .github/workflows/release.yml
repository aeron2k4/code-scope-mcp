name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag -a v0.1.0 -m
# "astlens 0.1.0" && git push origin v0.1.0`. To release a tag that
# already exists, run this workflow by hand with that tag. The tag must be on
# main.
#
# The release is a draft until every binary is in it, so that
# releases/latest/download never names a release that lacks one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions:
  contents: read

# Two runs for one tag, a push and one by hand, would each rewrite SHA256SUMS
# from the copy it downloaded and lose the other's lines.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the history of main, for the check below
          persist-credentials: false
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      # The release notes are the tag's section of CHANGELOG.md; a tag without
      # one stops here. Both files come from main, which holds the tag, so an
      # older tag released by hand finds them too.
      - name: Release notes
        run: |
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          git show origin/main:scripts/release-notes.sh |
            bash -s "$TAG" "$RUNNER_TEMP/CHANGELOG.md" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error

  # Linux decides the release: once its tests and build pass, the draft is
  # made, and the Windows and macOS runners only build. No build cache here or
  # below: a released binary is built from the tag alone, not from what an
  # earlier run left behind.
  linux:
    needs: check
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distros
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: scripts/test-guard.sh
      - run: cargo build --release --locked

      # Ship the bare executable, named by OS and without the version, so
      # releases/latest/download/astlens-<os> is a stable URL.
      - run: cp target/release/astlens astlens-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: astlens-linux
          if-no-files-found: error

  release:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # For the build provenance below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notes
      # A release that already exists is left as it is, so running this
      # workflow by hand for an old tag only adds or replaces the binaries
      # built below.
      - name: Look for the release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; keeping its Linux binary"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # SHA256SUMS sits beside the binaries, so it only tells a damaged
      # download. The provenance says which workflow run built a binary from
      # which commit: `gh attestation verify astlens-linux --repo <this repo>`.
      - if: steps.existing.outputs.found != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/astlens-*
      # One checksum file for all binaries: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum astlens-* > SHA256SUMS
      # A draft, which `others-publish` publishes once the other binaries are
      # in it.
      - name: Draft GitHub Release
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --title "astlens $TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft

  # Added to the draft when they finish. A failure leaves the release a draft
  # with the binaries that were built; a run by hand with the tag adds the
  # missing one and publishes.
  others:
    needs: release
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: astlens-windows.exe
          - os: macos-latest
            asset: astlens-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          cp target/release/astlens.exe "${{ matrix.asset }}"
        shell: bash
      # One universal binary for Apple silicon and Intel Macs.
      - if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
          lipo -create -output "${{ matrix.asset }}" \
            target/aarch64-apple-darwin/release/astlens \
            target/x86_64-apple-darwin/release/astlens
          lipo -info "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Separate from the builds, so that the write token never meets their
  # third-party actions and build scripts. One job for all of them, so that
  # SHA256SUMS is rewritten once.
  others-publish:
    needs: [release, others]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: astlens-*
          path: dist
          merge-multiple: true
      - name: Add binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(dist/astlens-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no binary was built"
            exit 1
          fi
          gh release download "$TAG" --pattern SHA256SUMS --clobber
          for path in "${assets[@]}"; do
            asset=${path#dist/}
            gh release upload "$TAG" "$path" --clobber
            grep -v "  $asset\$" SHA256SUMS > sums.new || true
            echo "$(sha256sum "$path" | cut -d' ' -f1)  $asset" >> sums.new
            mv sums.new SHA256SUMS
          done
          gh release upload "$TAG" SHA256SUMS --clobber
      # After the step above, which says so when nothing was built.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/astlens-*
      # Only a release with every binary is published. An old tag released by
      # hand is published already, and stays so.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPLETE: ${{ needs.others.result == 'success' }}
        run: |
          if [ "$COMPLETE" != true ]; then
            echo "::error::release $TAG is not published by this run: a binary is missing. Fix its build, then run this workflow by hand with the tag"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
