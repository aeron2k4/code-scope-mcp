name: Audit

# Advisories appear without any commit here, so this also runs on a schedule.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
